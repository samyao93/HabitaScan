<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HabitaScan · Administration</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f4f6fb,#0a1226);--card:light-dark(#ffffff,#121c36);--ink:light-dark(#0c1630,#eef2fb);--soft:light-dark(#5a6684,#a9b4cf);
--line:light-dark(#e3e7f0,#26324f);--blue:light-dark(#0b3d91,#6f9cff);--bluebg:light-dark(#e8eefb,#17264a);--side:light-dark(#0c1630,#070d1d);
--red:light-dark(#c8341b,#ff7a5c);--redbg:light-dark(#fdece8,#3a1610);--amber:light-dark(#a35a00,#ffb547);--amberbg:light-dark(#fff4e0,#3a2a0e);
--ok:light-dark(#1d7a3e,#5fd38a);--okbg:light-dark(#e7f6ec,#0f2e1c);--bar:light-dark(#2f5fbf,#6f9cff)}
*{box-sizing:border-box}html,body{margin:0}body{font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}
/* Mise en page */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--side);color:#dfe6f6;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700;font-size:16px;color:#fff}.logo img{width:30px;height:30px;border-radius:8px;background:#fff;padding:3px}
.logo small{display:block;font-weight:500;font-size:11px;color:#8d9bc0;letter-spacing:.04em;text-transform:uppercase}
.nav-t{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#7f8db3;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#c9d3ea;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.nav:hover{background:rgb(255 255 255/.06)}.nav[aria-current="page"]{background:rgb(255 255 255/.12);color:#fff;font-weight:600}
.nav .b{margin-left:auto;background:#e0533a;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.side-pied{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgb(255 255 255/.08);font-size:12px;color:#8d9bc0;display:flex;flex-direction:column;gap:6px}
.side-pied button{background:none;border:1px solid rgb(255 255 255/.18);color:#dfe6f6;border-radius:8px;padding:6px 10px;cursor:pointer}
main{padding:24px 32px 60px;min-width:0}
.tete{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.tete h1{font-size:22px;margin:0;letter-spacing:-.01em}.tete p{margin:2px 0 0;color:var(--soft)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--blue)}.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.dan{color:var(--red)}.btn.dan:hover{border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}.btn.sm{padding:4px 10px;font-size:13px}
.carte{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.carte h2{font-size:15px;margin:0 0 12px}.carte-tete{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.carte-tete h2{margin:0}
.grille{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi span{color:var(--soft);font-size:13px}.kpi b{display:block;font-size:26px;margin-top:4px;letter-spacing:-.01em}.kpi small{color:var(--soft);font-size:12px}
.kpi.alerte{border-color:var(--red)}.kpi.alerte b{color:var(--red)}
.muted{color:var(--soft)}.hint{color:var(--soft);font-size:13px;margin:6px 0 0}
/* Tableaux */
.tab-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;font-weight:600;color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:var(--bg);position:sticky;top:0}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tbody tr.cl{cursor:pointer}tbody tr.cl:hover td{background:var(--bluebg)}
td.r,th.r{text-align:right}.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.p-r{background:var(--redbg);color:var(--red)}.p-y{background:var(--amberbg);color:var(--amber)}.p-g{background:var(--okbg);color:var(--ok)}.p-n{background:var(--bluebg);color:var(--blue)}.p-x{background:var(--bg);color:var(--soft);border:1px solid var(--line)}
.filtres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtres input,.filtres select,.champ input,.champ select,.champ textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
.filtres input[type=search]{min-width:260px;flex:1}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--soft);font-size:13px}
.vide{text-align:center;color:var(--soft);padding:30px}
/* Formulaires de réglages */
.champ{display:grid;grid-template-columns:1fr 200px auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.champ:last-child{border-bottom:0}
.champ label b{display:block;font-weight:600}.champ label small{color:var(--soft)}
.champ.large{grid-template-columns:1fr}.champ.large textarea{width:100%;min-height:70px}
.inter{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}.inter:last-child{border-bottom:0}
.inter b{display:block}.inter small{color:var(--soft)}
.sw{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.3);transition:transform .15s}
.sw:checked{background:var(--ok)}.sw:checked::after{transform:translateX(18px)}
.onglets{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.onglets button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--soft);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.onglets button[aria-selected="true"]{color:var(--blue);border-color:var(--blue)}
/* Graphique */
.graph{position:relative}.graph svg{width:100%;height:180px;display:block}.graph .tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.repart{display:flex;flex-direction:column;gap:10px}.repart div{display:grid;grid-template-columns:130px 1fr 96px;gap:10px;align-items:center;font-size:13px}
.jauge{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.jauge i{display:block;height:100%;border-radius:5px}
/* Panneau latéral */
.voile{position:fixed;inset:0;background:rgb(5 10 25/.45);z-index:20;display:none}.voile.ouvert{display:block}
.panneau{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:21;transform:translateX(100%);transition:transform .2s,visibility .2s;overflow:auto;visibility:hidden}
.panneau.ouvert{transform:none;visibility:visible;box-shadow:-10px 0 40px rgb(0 0 0/.2)}.panneau .p-tete{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:1}
.panneau .p-tete h2{margin:0;font-size:17px;overflow-wrap:anywhere}.panneau .p-corps{padding:20px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:0 0 16px;font-size:13.5px}.dl dt{color:var(--soft)}.dl dd{margin:0;overflow-wrap:anywhere}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:22px 0 8px;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;z-index:40;font-weight:600;display:none;max-width:90vw}
.toast.err{background:var(--red);color:#fff}
.banniere{background:var(--amberbg);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-weight:600}
/* Connexion */
.connexion{min-height:100vh;display:grid;place-items:center;padding:20px}
.connexion .carte{width:min(400px,100%);padding:28px}.connexion h1{font-size:20px;margin:12px 0 4px}.connexion label{display:block;font-weight:600;margin:16px 0 6px}
.connexion input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}.connexion .btn{width:100%;margin-top:16px;padding:11px}
.err{color:var(--red);min-height:20px;margin:10px 0 0;font-size:13px}
.burger{display:none}
@media (max-width:900px){.shell{grid-template-columns:1fr}aside{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s}aside.ouvert{transform:none}
 main{padding:16px}table{min-width:680px}.burger{display:inline-flex}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:1fr}.champ{grid-template-columns:1fr}.dl{grid-template-columns:1fr}}
.edition{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
@media (max-width:1100px){.edition{grid-template-columns:1fr}}
.edition textarea{width:100%;min-height:560px;font:13.5px/1.55 ui-monospace,Consolas,monospace;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg,#fff);color:inherit;resize:vertical}
.apercu-legal{max-height:600px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:16px;font-size:14px;line-height:1.55}
.apercu-legal h1{font-size:22px;margin:0 0 8px}.apercu-legal h2{font-size:16px;margin:0 0 8px}
.apercu-legal .card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.apercu-legal table{width:100%;border-collapse:collapse;font-size:13px}.apercu-legal th,.apercu-legal td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.aide-md code{background:rgba(127,127,127,.12);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<div id="racine"></div>
<div class="voile" id="voile"></div><div class="panneau" id="panneau" role="dialog" aria-modal="true" aria-labelledby="p-titre"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="/md.js"></script>
<script>
"use strict";
const DEMO=false;
const SUPABASE_URL="https://oyiiaqyepihkawzkkjpi.supabase.co",SUPABASE_KEY="sb_publishable_LhDVlSvpyM-bkW-QSp0lsw_wgNIsELX";
const sb=!DEMO&&window.supabase?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=s=>document.querySelector(s),R=$("#racine");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nb=n=>Number(n||0).toLocaleString("fr-CA");
const argent=n=>Number(n||0).toLocaleString("fr-CA",{style:"currency",currency:"CAD"});
const dt=d=>d?new Date(d).toLocaleString("fr-CA",{dateStyle:"medium",timeStyle:"short"}):"—";
const dj=d=>d?new Date(d).toLocaleDateString("fr-CA",{dateStyle:"medium"}):"—";
const ilya=d=>{if(!d)return "—";const m=(Date.now()-new Date(d))/6e4;if(m<1)return "à l'instant";if(m<60)return `il y a ${Math.round(m)} min`;if(m<1440)return `il y a ${Math.round(m/60)} h`;return `il y a ${Math.round(m/1440)} j`};
function toast(t,err){const e=$("#toast");e.textContent=t;e.className="toast"+(err?" err":"");e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",3500)}
const msgErr=e=>{const m=(e&&(e.message||e.error_description))||String(e);return /reserve aux admins/.test(m)?"Accès réservé aux administrateurs.":m};

/* ===== Accès aux données ===== */
const API={
 async rpc(n,a){if(DEMO)return DEMO_API.rpc(n,a);const {data,error}=await sb.rpc(n,a||{});if(error)throw error;return data},
 async table(t,cols,ordre){if(DEMO)return DEMO_API.table(t);let q=sb.from(t).select(cols);if(ordre)q=q.order(ordre[0],{ascending:ordre[1]!==false});const {data,error}=await q;if(error)throw error;return data||[]},
 async pieces(uid){if(DEMO)return [];const {data}=await sb.storage.from("pieces-identite").list(uid,{limit:20});const out=[];for(const f of data||[]){const {data:u}=await sb.storage.from("pieces-identite").createSignedUrl(`${uid}/${f.name}`,300);if(u)out.push({nom:f.name,url:u.signedUrl})}return out},
 async majMediane(ville,chambres,mediane,periode){const {data,error}=await sb.from("loyers_reference").update({mediane,mediane_periode:periode}).eq("ville",ville).eq("chambres",chambres).select("ville");if(error)throw error;
  if(!data||!data.length){const r=await sb.from("loyers_reference").insert({ville,chambres,mediane,mediane_periode:periode});if(r.error)throw r.error}},
 async supprimerCompte(uid){if(DEMO)return DEMO_API.supprimer(uid);const {data,error}=await sb.functions.invoke("admin-supprimer-compte",{body:{user_id:uid}});if(error)throw error;if(data&&data.error)throw new Error(data.error);return data}
};

/* ===== État ===== */
const S={vue:"tableau",moi:null,badges:{},u:{q:"",f:"tous",p:0},v:{q:"",c:"",m:"",p:0},d:{statut:""},reglages:"tarifs"};
const VUES=[
 ["Activité",[["tableau","Tableau de bord"],["demandes","Vérifications payées","demandes"],["verifications","Vérifications"],["utilisateurs","Utilisateurs"]]],
 ["Modération",[["identites","Identités","identites"],["signalements","Signalements"],["connexions","Connexions"]]],
 ["Configuration",[["reglages","Réglages"],["pages","Pages légales"],["loyers","Loyers de référence"],["admins","Administrateurs"]]],
 ["Suivi",[["journal","Journal d'administration"],["erreurs","Erreurs techniques","erreurs"]]]];

/* ===== Connexion ===== */
async function demarrer(){
 if(DEMO){S.moi={contact:"admin@habitascan.demo",id:"demo-moi"};await majBadges();return coquille()}
 const {data}=await sb.auth.getSession();if(!data.session)return ecranConnexion();
 let ok=false;try{ok=await API.rpc("est_admin")}catch(e){}
 if(!ok)return ecranRefus(data.session.user.email);
 S.moi={contact:data.session.user.email,id:data.session.user.id};await majBadges();coquille()}
function ecranConnexion(etape,courriel){
 R.innerHTML=`<div class="connexion"><form class="carte" id="f-cx" novalidate><img src="icon.svg" width="44" height="44" alt=""><h1>Administration HabitaScan</h1><p class="muted">Accès réservé aux administrateurs.</p>
 ${etape==="code"?`<label for="code">Code reçu par courriel (${esc(courriel)})</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>`:`<label for="courriel">Courriel</label><input id="courriel" type="email" autocomplete="email" required>`}
 <button class="btn pri" type="submit">${etape==="code"?"Se connecter":"Recevoir un code"}</button><p class="err" id="err" role="alert"></p>
 <p class="hint"><a href="/">Retour à l'app</a></p></form></div>`;
 $("#f-cx").onsubmit=async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;$("#err").textContent="";
  try{if(etape==="code"){const {error}=await sb.auth.verifyOtp({email:courriel,token:$("#code").value.trim(),type:"email"});if(error)throw error;demarrer()}
   else{const c=$("#courriel").value.trim();const {error}=await sb.auth.signInWithOtp({email:c,options:{shouldCreateUser:false}});if(error)throw error;ecranConnexion("code",c)}}
  catch(e){b.disabled=false;$("#err").textContent=etape==="code"?"Code invalide ou expiré.":"Envoi impossible. Vérifie le courriel."}}}
function ecranRefus(c){R.innerHTML=`<div class="connexion"><div class="carte"><img src="icon.svg" width="44" height="44" alt=""><h1>Accès refusé</h1><p class="muted">Le compte ${esc(c||"")} n'est pas administrateur.</p><button class="btn" id="deco">Se déconnecter</button></div></div>`;$("#deco").onclick=async()=>{await sb.auth.signOut();ecranConnexion()}}

/* ===== Coquille ===== */
function coquille(){
 R.innerHTML=`<div class="shell"><aside id="side" aria-label="Navigation"><div class="logo"><img src="icon.svg" alt=""><div>HabitaScan<small>Administration${DEMO?" · démo":""}</small></div></div>
 ${VUES.map(([t,l])=>`<div class="nav-t">${t}</div>`+l.map(([k,n,b])=>`<button class="nav" data-vue="${k}" ${S.vue===k?'aria-current="page"':""}>${n}${b&&S.badges[b]?`<span class="b">${S.badges[b]}</span>`:""}</button>`).join("")).join("")}
 <div class="side-pied"><span>${esc(S.moi.contact)}</span><a href="/" style="color:#c9d3ea">Ouvrir l'app ↗</a><button id="deco">Se déconnecter</button></div></aside>
 <main id="main"></main></div>`;
 document.querySelectorAll("[data-vue]").forEach(b=>b.onclick=()=>{S.vue=b.dataset.vue;$("#side").classList.remove("ouvert");coquille()});
 $("#deco").onclick=async()=>{if(DEMO)return toast("Démo : déconnexion désactivée.");await sb.auth.signOut();ecranConnexion()};
 afficher()}
function tete(titre,sous,actions=""){return `<div class="tete"><div style="display:flex;gap:10px;align-items:center"><button class="btn burger" id="burger" aria-label="Menu">☰</button><div><h1>${titre}</h1>${sous?`<p>${sous}</p>`:""}</div></div><div class="actions">${actions}<button class="btn" id="actu">Actualiser</button></div></div>`}
async function afficher(){const m=$("#main");m.innerHTML=`<p class="muted">Chargement…</p>`;
 try{await (V[S.vue]||V.tableau)(m)}catch(e){m.innerHTML=tete("Erreur")+`<div class="carte"><p class="err">${esc(msgErr(e))}</p></div>`}
 const bu=$("#burger");if(bu)bu.onclick=()=>$("#side").classList.toggle("ouvert");const a=$("#actu");if(a)a.onclick=()=>afficher()}
async function majBadges(){try{const t=await API.rpc("admin_tableau");S.badges={demandes:t.demandes&&t.demandes.payee||0,identites:t.identites_attente||0,erreurs:t.erreurs_24h||0};return t}catch(e){return null}}

/* ===== Panneau latéral ===== */
function panneau(titre,corps,apres){const p=$("#panneau");p.innerHTML=`<div class="p-tete"><h2 id="p-titre">${titre}</h2><button class="btn sm" id="p-fermer" aria-label="Fermer">Fermer</button></div><div class="p-corps">${corps}</div>`;
 p.classList.add("ouvert");$("#voile").classList.add("ouvert");$("#p-fermer").onclick=fermer;$("#voile").onclick=fermer;$("#p-fermer").focus();if(apres)apres(p)}
function fermer(){$("#panneau").classList.remove("ouvert");$("#voile").classList.remove("ouvert")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")fermer()});

/* ===== Petits composants ===== */
const COUL={r:["p-r","Ne paie pas"],y:["p-y","Prudence"],g:["p-g","Aucun signal"]};
const pillC=c=>COUL[c]?`<span class="pill ${COUL[c][0]}">${COUL[c][1]}</span>`:`<span class="pill p-x">—</span>`;
const STAT_D={a_payer:["p-x","Non payée"],payee:["p-y","À traiter"],terminee:["p-g","Terminée"],remboursee:["p-n","Remboursée"]};
const pillD=s=>`<span class="pill ${(STAT_D[s]||["p-x"])[0]}">${(STAT_D[s]||[0,s])[1]}</span>`;
const VERDICTS={correspond:"Propriétaire trouvé ; correspond à l'annonceur",ne_correspond_pas:"Propriétaire trouvé ; ne correspond pas à l'annonceur",compagnie:"Le propriétaire est une entreprise",introuvable:"Propriétaire introuvable",trouve:"Propriétaire trouvé (aucun nom d'annonceur fourni)"};
const GLOBAL={continuer:["p-g","Tu peux continuer"],precautions:["p-y","Continue avec précaution"],arreter:["p-r","Arrête"]};
const ENT={lie:"Entreprise active",non_lie:"Active, mais l'annonceur n'est pas parmi les dirigeants",inactive:"Entreprise non active",non_verifie:"Non vérifié"};
const PHOTOS={aucune:"Photos non trouvées ailleurs",reutilisees:"Photos trouvées ailleurs",non_verifie:"Non vérifié (pas de photo)"};
const DOUBLONS={aucun:"Aucune autre annonce",trouves:"Annoncé ailleurs (autre nom ou prix)",non_verifie:"Non vérifié"};
const ID_ST={aucune:["p-x","Non vérifiée"],en_attente:["p-y","En attente"],confirmee:["p-g","Confirmée"],refusee:["p-r","Refusée"]};
const pillI=s=>`<span class="pill ${(ID_ST[s]||ID_ST.aucune)[0]}">${(ID_ST[s]||ID_ST.aucune)[1]}</span>`;
const ROLES={proprietaire:"dit être propriétaire",gestionnaire:"dit être gestionnaire",locataire:"propriétaire nommé par le locataire"};
const lienExt=(u,t)=>/^https?:\/\//i.test(u||"")?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t||u)}</a>`:esc(u||"—");
function graphBarres(serie,etiq){const W=600,H=180,pb=22,pt=8,n=serie.length||1,max=Math.max(1,...serie.map(x=>x.n)),bw=W/n;
 const ticks=[0,Math.ceil(max/2),max];
 return `<div class="graph"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(etiq)} par jour, 30 derniers jours">
 ${ticks.map(t=>{const y=pt+(H-pb-pt)*(1-t/max);return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`}).join("")}
 ${serie.map((x,i)=>{const h=(H-pb-pt)*x.n/max,y=H-pb-h;return `<g data-i="${i}"><rect x="${i*bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>${x.n?`<path d="M${i*bw+2},${H-pb} V${y+Math.min(4,h)} q0,-${Math.min(4,h)} ${Math.min(4,h)},-${Math.min(4,h)} H${(i+1)*bw-2-Math.min(4,h)} q${Math.min(4,h)},0 ${Math.min(4,h)},${Math.min(4,h)} V${H-pb} Z" fill="var(--bar)"/>`:""}</g>`}).join("")}
 <line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--soft)" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>
 <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--soft)"><span>${dj(serie[0]&&serie[0].jour)}</span><span>max. ${nb(max)} / jour</span><span>${dj(serie[n-1]&&serie[n-1].jour)}</span></div><div class="tt"></div></div>`}
function lierGraph(el,serie,etiq){el.querySelectorAll(".graph").forEach((g,gi)=>{const s=serie[gi],tt=g.querySelector(".tt"),svg=g.querySelector("svg");
 svg.addEventListener("mousemove",e=>{const r=svg.getBoundingClientRect(),i=Math.min(s.length-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*s.length)));const x=s[i];
  tt.textContent=`${dj(x.jour)} : ${nb(x.n)} ${etiq[gi]}`;tt.style.left=(e.clientX-r.left)+"px";tt.style.top=(e.clientY-r.top)+"px";tt.style.display="block"});
 svg.addEventListener("mouseleave",()=>tt.style.display="none")})}
function csv(nom,lignes){if(!lignes.length)return toast("Rien à exporter.");if(DEMO)return toast("Démo : l'export CSV fonctionne dans la vraie console.");const cols=Object.keys(lignes[0]);
 const c=v=>{const s=v==null?"":typeof v==="object"?JSON.stringify(v):String(v);return /[",\n;]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
 const blob=new Blob(["﻿"+[cols.join(","),...lignes.map(l=>cols.map(k=>c(l[k])).join(","))].join("\n")],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`habitascan-${nom}-${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function agir(bouton,fn,ok){bouton.disabled=true;try{await fn();if(ok)toast(ok);return true}catch(e){toast(msgErr(e),true);return false}finally{bouton.disabled=false}}

function detailDemande(d){const r=d.rapport||{},reg=r.registre||{},en=r.entreprise||{},ph=r.photos||{},db=r.doublons||{};
 const sel=(id,opts,cur,vide)=>`<select id="${id}">${vide?`<option value="">${vide}</option>`:""}${Object.entries(opts).map(([k,l])=>`<option value="${k}" ${cur===k?"selected":""}>${l}</option>`).join("")}</select>`;
 const det=(id,v,ph_)=>`<textarea id="${id}" maxlength="400" rows="2" placeholder="${ph_}">${esc(v||"")}</textarea>`;
 const editable=d.statut==="payee"||d.statut==="terminee";
 panneau(`Demande · ${esc(d.adresse)}`,`<p>${pillD(d.statut)} ${d.verdict_global?`<span class="pill ${GLOBAL[d.verdict_global][0]}">${GLOBAL[d.verdict_global][1]}</span>`:""}</p>

 <dt>Nom de l'annonceur</dt><dd>${!d.nom_interlocuteur?`<span class="muted">Non fourni : trouve le propriétaire à partir de l'adresse.</span>`:/^\(refuse/.test(d.nom_interlocuteur)?`<span class="pill p-r">L'annonceur refuse de donner le nom</span><br><small class="muted">Trouve le propriétaire à partir de l'adresse et indique s'il s'agit d'une personne ou d'une entreprise.</small>`:`<b>${esc(d.nom_interlocuteur)}</b>${d.role?` (${ROLES[d.role]||esc(d.role)})`:""}`}</dd><dt>Annonce</dt><dd>${lienExt(d.lien)}</dd>
 <dt>Reçue</dt><dd>${dt(d.created_at)}</dd><dt>Payée</dt><dd>${dt(d.paye_le)}${d.montant?` · ${argent(d.montant)}`:""}</dd><dt>Rapport envoyé</dt><dd>${dt(d.termine_le)}</dd><dt>Référence Stripe</dt><dd class="num">${esc(d.stripe_ref||"—")}</dd></dl>
 ${editable?`<div class="sec">1. Propriétaire au Registre foncier</div><p class="hint" style="margin-top:0"><a href="https://www.registrefoncier.gouv.qc.ca/" target="_blank" rel="noopener">Registre foncier</a> : index des immeubles du lot, puis dernier acte de vente (1 $ par document).</p>
 <div class="champ large">${sel("r-reg",VERDICTS,reg.resultat||d.verdict,"— Résultat —")}<input id="r-reg-nom" maxlength="120" placeholder="Nom du propriétaire inscrit : le client le cherchera sur le bail" value="${esc(reg.nom||"")}" style="border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card)">${det("r-reg-d",reg.details,"Visible par le client. Ex. : propriétaire inscrit depuis 2019.")}</div>
 <div class="sec">2. Entreprise propriétaire</div><label class="inter" style="padding-top:0"><span><b>Le propriétaire est une entreprise</b><small>Vérifie au <a href="https://www.registreentreprises.gouv.qc.ca/" target="_blank" rel="noopener">registre des entreprises</a> (gratuit) : statut et dirigeants.</small></span><input type="checkbox" class="sw" id="r-ent" ${en.applicable?"checked":""}></label>
 <div id="r-ent-z" ${en.applicable?"":"hidden"}><div class="grille g2"><input id="r-ent-nom" placeholder="Nom de l'entreprise" value="${esc(en.nom||"")}" style="border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card)"><input id="r-ent-neq" placeholder="NEQ" inputmode="numeric" value="${esc(en.neq||"")}" style="border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card)"></div>
 <div class="champ large">${sel("r-ent-l",ENT,en.lien,"— Résultat —")}${det("r-ent-d",en.details,"Visible par le client. Ex. : entreprise active ; ton interlocuteur est président.")}</div></div>

 <div class="sec">4. Autres annonces du même logement</div><p class="hint" style="margin-top:0">Cherche l'adresse et le texte de l'annonce sur Kijiji, Facebook, LesPAC, Kangalou.</p><div class="champ large">${sel("r-db",DOUBLONS,db.resultat,"— Résultat —")}${det("r-db-d",db.details,"Visible par le client.")}</div>
 <div class="sec">5. Verdict et recommandations</div><div class="champ large">${sel("r-g",Object.fromEntries(Object.entries(GLOBAL).map(([k,v])=>[k,v[1]])),r.global||d.verdict_global,"— Verdict global —")}

   if(await agir(env,()=>API.rpc("admin_maj_rapport",{p_id:d.id,p_rapport:x,p_terminer:true}),"Rapport envoyé au client.")){fermer();afficher()}};

V.pages=async m=>{const P={confidentialite:"Politique de confidentialité",conditions:"Conditions d'utilisation"};S.pg=S.pg||"confidentialite";
 let rows=[],manque=false;try{rows=await API.table("pages_legales","cle,contenu,maj_le")}catch(e){manque=true}
 const ligne=rows.find(r=>r.cle===S.pg);let txt=ligne&&ligne.contenu||"";
 if(!txt){try{const r=await fetch("/textes/"+S.pg+".md");if(r.ok)txt=await r.text()}catch(e){}}
 m.innerHTML=tete("Pages légales","Modifie la politique de confidentialité et les conditions d'utilisation. Une fois publiées, les modifications s'affichent tout de suite sur le site et dans l'app.")+
 (manque?`<div class="banniere">La table des pages n'existe pas encore dans Supabase : colle la migration <b>supabase/migrations/20261120_pages_legales.sql</b> dans SQL Editor, puis Run.</div>`:"")+
 `<div class="actions">${Object.entries(P).map(([k,l])=>`<button class="btn ${S.pg===k?"pri":""}" data-pg="${k}">${l}</button>`).join("")}</div>
 <div class="carte"><p class="hint aide-md">${ligne?`Dernière publication : ${dt(ligne.maj_le)}.`:"Texte d'origine, pas encore modifié."} Mise en forme : <code># Titre de la page</code> · <code>## Titre de section</code> · <code>- élément de liste</code> · <code>**gras**</code> · <code>[texte du lien](https://adresse)</code> · tableau <code>| Colonne A | Colonne B |</code>. Une ligne vide sépare les paragraphes.</p>
 <div class="edition"><textarea id="pg-txt" spellcheck="true" aria-label="Texte de la page">${esc(txt)}</textarea><div id="pg-apercu" class="apercu-legal" aria-label="Aperçu"></div></div>
 <div class="actions" style="margin-top:12px"><button class="btn pri" id="pg-ok" ${manque?"disabled":""}>Publier</button><a class="btn" href="/${S.pg}" target="_blank" rel="noopener">Voir la page publique</a></div></div>`;
 const ta=m.querySelector("#pg-txt"),ap=m.querySelector("#pg-apercu");
 const maj=()=>{ap.innerHTML=window.hsMarkdown?hsMarkdown(ta.value,{sections:true}):"Aperçu indisponible"};ta.oninput=maj;maj();
 m.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{S.pg=b.dataset.pg;afficher()});
 m.querySelector("#pg-ok").onclick=async e=>{if(ta.value.trim().length<50)return toast("Le texte est trop court.",true);
  if(await agir(e.target,()=>API.rpc("admin_maj_page",{p_cle:S.pg,p_contenu:ta.value}),"Page publiée : elle est en ligne sur le site et dans l'app."))afficher()}};
V.loyers=async m=>{let L,medOk=true;try{L=await API.table("loyers_reference","ville,chambres,loyer,periode,source,mediane,mediane_periode",["ville"])}catch(e){medOk=false;L=await API.table("loyers_reference","ville,chambres,loyer,periode,source",["ville"])}
 L.sort((a,b)=>a.ville.localeCompare(b.ville,"fr")||a.chambres-b.chambres);
 const villes=[...new Set(L.map(r=>r.ville))],cell=(v,c)=>L.find(r=>r.ville===v&&r.chambres===c);
 const CH=[[0,"Studio"],[1,"1 ch."],[2,"2 ch."],[3,"3 ch. +"]],nomCh=c=>c===0?"studio":`${c} chambre(s)`;
 const st="width:90px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--card)";
 const champ=(attr,v,c,val)=>`<td class="r"><input type="number" min="100" max="20000" ${attr}="${esc(v)}" data-c="${c}" value="${val||""}" aria-label="${esc(v)}, ${nomCh(c)}" style="${st}"></td>`;
 const perMed=(L.find(r=>r.mediane_periode)||{}).mediane_periode||"octobre 2025";
 m.innerHTML=tete("Loyers de référence","Loyers moyens et médians de la SCHL, par ville et par nombre de chambres (studio compris). Mets-les à jour à chaque publication de la SCHL.")+
 `<div class="carte"><h2>Loyers moyens SCHL</h2><p class="hint" style="margin-top:0">Servent à repérer un prix anormalement bas quand la médiane manque.</p></div>
 <div class="carte" style="padding:0"><div class="tab-wrap" style="border:0"><table><thead><tr><th>Ville</th>${CH.map(([,t])=>`<th class="r">${t}</th>`).join("")}<th>Période</th></tr></thead><tbody>
 ${villes.map(v=>`<tr><td><b>${esc(v)}</b></td>${CH.map(([c])=>champ("data-v",v,c,(cell(v,c)||{}).loyer)).join("")}<td class="muted">${esc((cell(v,2)||cell(v,1)||{}).periode||"—")}</td></tr>`).join("")}
 <tr><td><input id="nv-ville" placeholder="Nouvelle ville" style="border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--card);width:150px"></td>${CH.map(([c])=>`<td class="r"><input type="number" id="nv-${c}" min="100" style="${st}" aria-label="Nouvelle ville, ${nomCh(c)}"></td>`).join("")}<td></td></tr></tbody></table></div></div>
 <div class="carte"><div class="grille g2"><label>Période des données<br><input id="lper" value="${esc((L.find(r=>r.periode&&r.loyer)||L[0]||{}).periode||"")}" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card)"></label><label>Source<br><input id="lsrc" value="${esc((L[0]||{}).source||"")}" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card)"></label></div>
 <div class="actions" style="margin-top:12px"><button class="btn pri" id="lsave">Enregistrer les loyers moyens</button><a class="btn" href="https://www.cmhc-schl.gc.ca/professionnels/marche-du-logement-donnees-et-recherche/donnees-sur-le-logement/tableaux-de-donnees/donnees-sur-le-marche-locatif" target="_blank" rel="noopener">Données de la SCHL ↗</a></div></div>
 <div class="carte" id="medianes"><h2>Loyers médians SCHL</h2><p class="hint" style="margin-top:0">Utilisés pour le budget, le verdict et la comparaison du prix. Chaque décembre : Portail de l'information sur le marché de l'habitation, Québec, « Loyer médian ($) » selon le nombre de chambres. Case vide : l'app garde la médiane d'octobre 2025 intégrée.</p>${medOk?"":`<p class="hint">Colonnes des médianes absentes : applique la migration 20261124b.</p>`}</div>
 ${medOk?`<div class="carte" style="padding:0"><div class="tab-wrap" style="border:0"><table><thead><tr><th>Ville</th>${CH.map(([,t])=>`<th class="r">${t}</th>`).join("")}</tr></thead><tbody>
 ${villes.map(v=>`<tr><td><b>${esc(v)}</b></td>${CH.map(([c])=>champ("data-med",v,c,(cell(v,c)||{}).mediane)).join("")}</tr>`).join("")}</tbody></table></div></div>
 <div class="carte"><div class="grille g2"><label>Période des médianes<br><input id="mper" value="${esc(perMed)}" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card)"></label><label>Source<br><input value="SCHL, Enquête sur les logements locatifs (Portail de l'information sur le marché de l'habitation), loyer médian selon le nombre de chambres" readonly style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);color:var(--soft)"></label></div>
 <p class="hint">Appartements et maisons en rangée d'initiative privée. Valeurs de départ : Québec, octobre 2025.</p>
 <div class="actions" style="margin-top:12px"><button class="btn pri" id="msave">Enregistrer les médianes</button><a class="btn" href="https://www03.cmhc-schl.gc.ca/hmip-pimh/fr/TableMapChart/TableCategory?geographyType=Province&amp;geographyId=24&amp;categoryLevel1=March%C3%A9%20locatif%20primaire&amp;categoryLevel2=Loyer%20m%C3%A9dian%20%28%24%29" target="_blank" rel="noopener">Données de la SCHL (médianes) ↗</a></div></div>`:""}`;
 $("#lsave").onclick=async e=>{const per=$("#lper").value.trim(),src=$("#lsrc").value.trim();const ch=[];
  m.querySelectorAll("input[data-v]").forEach(i=>{const r=cell(i.dataset.v,+i.dataset.c),v=parseInt(i.value,10);if(v&&(!r||r.loyer!==v||r.periode!==per||r.source!==src))ch.push([i.dataset.v,+i.dataset.c,v])});
  const nv=$("#nv-ville").value.trim();if(nv)CH.forEach(([c])=>{const v=parseInt($("#nv-"+c).value,10);if(v)ch.push([nv,c,v])});
  if(!ch.length)return toast("Aucun changement.");
  if(await agir(e.target,async()=>{for(const [v,c,l] of ch)await API.rpc("admin_maj_loyer",{p_ville:v,p_chambres:c,p_loyer:l,p_periode:per,p_source:src})},`${ch.length} loyer${ch.length>1?"s":""} enregistré${ch.length>1?"s":""}.`))afficher()};
 if(medOk)$("#msave").onclick=async e=>{const per=$("#mper").value.trim().slice(0,40)||"octobre 2025";const ch=[];let bad=false;
  m.querySelectorAll("input[data-med]").forEach(i=>{const r=cell(i.dataset.med,+i.dataset.c),v=parseInt(i.value,10);if(!i.value)return;if(!(v>=100&&v<=20000)){bad=true;return}if(!r||r.mediane!==v||r.mediane_periode!==per)ch.push([i.dataset.med,+i.dataset.c,v])});
  if(bad)return toast("Une médiane doit être entre 100 et 20 000 $.",true);
  if(!ch.length)return toast("Aucun changement.");
  if(await agir(e.target,async()=>{for(const [v,c,l] of ch)await API.majMediane(v,c,l,per)},`${ch.length} médiane${ch.length>1?"s":""} enregistrée${ch.length>1?"s":""}.`))afficher()}};

V.admins=async m=>{const L=await API.rpc("admin_admins");
 m.innerHTML=tete("Administrateurs","Personnes qui ont accès à cette console.")+
 `<div class="carte" style="padding:0"><div class="tab-wrap" style="border:0"><table><thead><tr><th>Courriel</th><th>Ajouté le</th><th></th></tr></thead><tbody>${L.map((a,i)=>`<tr><td><b>${esc(a.contact||"—")}</b> ${a.moi?`<span class="pill p-n">Toi</span>`:""}</td><td>${dt(a.ajoute_le)}</td><td class="r">${a.moi?"":`<button class="btn sm dan" data-i="${i}">Retirer l'accès</button>`}</td></tr>`).join("")}</tbody></table></div></div>
 <div class="carte"><h2>Ajouter un administrateur</h2><p class="hint" style="margin-top:0">La personne doit d'abord avoir créé son compte dans l'app avec ce courriel.</p><div class="filtres" style="margin:10px 0 0"><input type="email" id="na" placeholder="courriel@exemple.com" aria-label="Courriel du nouvel administrateur" style="flex:1"><button class="btn pri" id="na-ok">Ajouter</button></div></div>`;
 $("#na-ok").onclick=async e=>{const c=$("#na").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c))return toast("Courriel invalide.",true);if(await agir(e.target,()=>API.rpc("admin_ajouter_admin",{p_courriel:c}),"Administrateur ajouté."))afficher()};
 m.querySelectorAll("button[data-i]").forEach(b=>b.onclick=async()=>{const a=L[+b.dataset.i];if(!confirm(`Retirer l'accès administrateur de ${a.contact} ?`))return;if(await agir(b,()=>API.rpc("admin_retirer_admin",{p_id:a.user_id}),"Accès retiré."))afficher()})};

const ACTIONS={parametre:"Réglage modifié",texte:"Message modifié",loyer:"Loyer modifié",suspendre:"Compte suspendu",reactiver:"Compte réactivé",supprimer_compte:"Compte supprimé",ajouter_admin:"Admin ajouté",retirer_admin:"Admin retiré",identite_confirmee:"Identité confirmée",identite_refusee:"Identité refusée",demande_terminee:"Verdict envoyé",rapport_envoye:"Rapport envoyé",rapport_brouillon:"Brouillon de rapport",demande_remboursee:"Demande remboursée",demande_payee:"Demande marquée payée",retirer_signalements:"Signalements retirés",vider_erreurs:"Erreurs effacées"};
V.journal=async m=>{const L=await API.rpc("admin_journal_liste",{p_limite:300});
 m.innerHTML=tete("Journal d'administration","Toutes les actions faites dans la console : qui, quoi, quand.",`<button class="btn" id="exp">Exporter (CSV)</button>`)+
 `<div class="carte" style="padding:0"><div class="tab-wrap" style="border:0">${L.length?`<table><thead><tr><th>Date</th><th>Admin</th><th>Action</th><th>Cible</th><th>Détails</th></tr></thead><tbody>${L.map(j=>`<tr><td>${dt(j.cree_le)}</td><td class="trunc">${esc(j.admin_contact||"—")}</td><td>${esc(ACTIONS[j.action]||j.action)}</td><td class="trunc">${esc(j.cible||"—")}</td><td class="trunc muted">${j.details?esc(Object.entries(j.details).filter(([,v])=>v!=null&&v!=="").map(([k,v])=>`${k} : ${v}`).join(" · ")):""}</td></tr>`).join("")}</tbody></table>`:`<p class="vide">Aucune action pour l'instant.</p>`}</div></div>`;
 $("#exp").onclick=()=>csv("journal",L)};

V.erreurs=async m=>{const L=await API.rpc("admin_erreurs",{p_limite:300});
 m.innerHTML=tete("Erreurs techniques","Erreurs JavaScript survenues chez les utilisateurs (5 au plus par session, sans renseignement personnel).",`${L.length?`<button class="btn dan" id="vider">Tout effacer</button>`:""}`)+
 `<div class="carte" style="padding:0"><div class="tab-wrap" style="border:0">${L.length?`<table><thead><tr><th>Date</th><th>Écran</th><th>Message</th><th>Navigateur</th></tr></thead><tbody>${L.map(e=>`<tr><td>${dt(e.cree_le)}</td><td>${esc(e.vue||"—")}</td><td style="font-family:ui-monospace,monospace;font-size:12.5px">${esc(e.message)}</td><td class="trunc muted">${esc(e.agent||"")}</td></tr>`).join("")}</tbody></table>`:`<p class="vide">Aucune erreur.</p>`}</div></div>`;
 const v=$("#vider");if(v)v.onclick=async()=>{if(!confirm("Effacer toutes les erreurs ?"))return;if(await agir(v,()=>API.rpc("admin_vider_erreurs"),"Erreurs effacées.")){await majBadges();coquille()}}};

/* ===== Démarrage ===== */
(async()=>{if(!DEMO&&!sb){R.innerHTML=`<div class="connexion"><div class="carte"><p class="err">Chargement impossible. Vérifie ta connexion.</p></div></div>`;return}
 if(!DEMO)sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")ecranConnexion()});
 demarrer()})();
</script>
